<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>متجر العاقل</title><link rel="stylesheet" href="/static/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body>
<div id="intro" class="intro"><div class="intro-mark">✦</div><div>متجر العاقل</div></div><canvas id="stars"></canvas><header><div class="brand-mark">✦</div><div><div class="brand">العاقل</div><small>متجر الملفات الرقمية</small></div><span class="status">● متصل</span></header>
<main><section class="hero"><div class="eyebrow">ALAQIL DIGITAL STORE</div><h1>معرفتك، <span>بخطوة.</span></h1><p>محتوى رقمي مختار بعناية، وتسليم سهل وآمن عبر تيليجرام.</p><div class="hero-glow"></div></section>
<div class="tabs"><button class="tab active" data-page="products">المنتجات</button><button class="tab" data-page="reviews">تقييمات العملاء</button></div>
<section id="productsPage" class="page active"><div class="section-head"><div><h2>المنتجات</h2><p>اختر ما يناسبك</p></div><span class="count" id="productCount">—</span></div><div id="products" class="products"><div class="loading">يجري تجهيز المتجر <span>✦</span></div></div></section>
<section id="reviewsPage" class="page"><div class="section-head"><div><h2>تقييمات العملاء</h2><p>آراء وتجارب المشترين</p></div></div><div id="reviews" class="reviews"></div><div class="review-form"><h3>أضف تقييمك</h3><input id="reviewName" placeholder="اسم العرض"><select id="rating"><option value="5">★★★★★ — 5</option><option value="4">★★★★ — 4</option><option value="3">★★★ — 3</option><option value="2">★★ — 2</option><option value="1">★ — 1</option></select><textarea id="reviewText" placeholder="اكتب تجربتك..."></textarea><button id="sendReview" class="gold-btn">إرسال التقييم للمراجعة</button><p id="reviewMsg" class="hint"></p></div></section></main>
<nav class="bottom"><button class="tab active" data-page="products"><span>⌂</span>المنتجات</button><button class="tab" data-page="reviews"><span>✧</span>التقييمات</button></nav><div id="toast" class="toast"></div><script src="/static/app.js"></script></body></html>
